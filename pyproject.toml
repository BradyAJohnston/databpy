[project]
name = "databpy"
version = "0.8.0"
description = "A data-oriented wrapper library for the Blender Python API"
readme = "README.md"
dependencies = [
    "numpy",
]
requires-python = "~=3.13.0"
keywords = ["blender", "python", "numpy"]
maintainers = [
    {name="Brady Johnston", email="brady.johnston@me.com"},
    ]

[project.urls]
Homepage = "https://bradyajohnston.github.io/databpy"
Repository = "https://github.com/bradyajohnston/databpy"
Documentation = "https://bradyajohnston.github.io/databpy"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"


[project.optional-dependencies]
bpy = ["bpy>=5.2"]

[tool.ruff]
# generated from README.qmd by quarto
extend-exclude = ["README.md"]

[tool.ruff.lint]
# bpy collections iterate over their items rather than their names, so `.keys()` is
# needed to get the names
ignore = ["SIM118"]

[tool.ruff.lint.per-file-ignores]
# property access inside `pytest.raises` and broad catches for optional imports
"tests/**" = ["B018", "BLE001"]

[tool.uv.workspace]
members = [
    ".",
]

[dependency-groups]
dev = [
    "fake-bpy-module",
    "polars",
    "quarto-cli>=1.9",
    "quartodoc",
    "jupyter",
    "pytest",
    "pytest-cov",
    "nodebpy>=520.8.0",
]
