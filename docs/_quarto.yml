project:
  type: website
  output-dir: _build
  pre-render: _config.py

filters:
  - interlinks

website:
  page-navigation: true
  llms-txt: true
  title: "databpy {{< var version >}}"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: attributes.qmd
        text: Attributes
      - href: api/index.qmd
        text: API
      - href: changelog.qmd
        text: Changelog
    tools:
      - icon: github
        href: https://github.com/BradyAJohnston/databpy

format:
  html:
    page-layout: full
    theme:
      - sandstone
      - style.scss
    toc: true
    toc-depth: 2
    preview-colour:
      code: true
      text: true

# tell quarto to read the generated sidebar
metadata-files:
  - api/_sidebar.yml

interlinks:
  fast: true
  aliases:
    databpy: null # Allow shortened internal references
    numpy: np
    molecularnodes: mn
  sources:
    numpy:
      url: https://numpy.org/doc/stable/
    python:
      url: https://docs.python.org/3/
    bpy:
      url: https://docs.blender.org/api/current/

quartodoc:
  # the name used to import the package you want to create reference docs for
  package: databpy
  dir: api

  # write sidebar and style data
  sidebar: api/_sidebar.yml
  css: api/_styles-quartodoc.css

  # enable automatic linking of type annotations
  render_interlinks: true

  options:
    include_inherited: true

  sections:
    - title: Attribute
      desc: For interacting with attributes on meshes
      contents:
        - named_attribute
        - store_named_attribute
        - remove_named_attribute
        - AttributeDomains
        - AttributeTypes
        - AttributeArray
    - title: Collections
      desc: Working with collections in Blender
      contents:
        - create_collection
        - move_to_collection
    - title: Objects
      contents:
        # - object.ObjectTracker
        - create_object
        - create_mesh_object
        - create_curves_object
        - create_pointcloud_object
        - create_bob
        - evaluate_object
        - GeometrySet
        - BlenderObject
        - BlenderObjectAttribute
        - BlenderObjectBase
        - LinkedObjectError
    - title: Utilities
      desc: Typed helpers that check for None or narrow data-block types, plus general utilities
      contents:
        - require
        - require_data
        - mesh_data
        - curves_data
        - pointcloud_data
        - volume_data
        - active_scene
        - active_object
        - centre
        - lerp
    - title: Nodes
      desc: Helpers for building and manipulating geometry node trees
      contents:
        - nodes.new_tree
        - nodes.swap_tree
        - nodes.custom_string_iswitch
        - nodes.append_from_blend
        - nodes.new_socket
        - nodes.tree_interface
        - nodes.input_socket
        - nodes.output_socket
        - nodes.socket_value
        - nodes.set_socket_value
        - nodes.MaintainConnections
        - nodes.DuplicatePrevention
