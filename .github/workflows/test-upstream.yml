name: Test Upstream

# Run the test suites of projects that depend on databpy against this branch, to catch
# breaking changes before release. Each project's environment is set up with uv and
# bpy as it is in its own CI, then databpy is replaced with the version from this branch.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-upstream:
    name: ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: BradyAJohnston/MolecularNodes
            setup: uv run --no-sync -m nodebpy.assets build
            test: uv run --no-sync pytest -n auto
    steps:
      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repo }}
          path: upstream

      - name: Checkout databpy
        uses: actions/checkout@v5
        with:
          path: databpy

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: upstream
        run: uv sync --all-extras

      # `--no-sync` on the following steps stops uv from restoring the locked databpy
      - name: Install databpy from this branch
        working-directory: upstream
        run: |
          uv pip install ../databpy
          uv run --no-sync python -c "import databpy; print(databpy.__file__)"

      - name: Setup
        if: matrix.setup
        working-directory: upstream
        timeout-minutes: 10
        run: ${{ matrix.setup }}

      - name: Run tests
        working-directory: upstream
        timeout-minutes: 15
        run: ${{ matrix.test }}
